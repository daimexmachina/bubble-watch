[package]
name = "bubble-watch"
version = "0.1.0"
edition = "2021"
description = "Track and assess whether the AI capex/equity boom is a bubble, with published weights and auditable math."
license = "MIT"

[[bin]]
name = "bubble-watch"
path = "src/main.rs"

[lib]
name = "bubble_watch"
path = "src/lib.rs"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[profile.release]
opt-level = 2
