# bubble-watch indicator configuration
#
# EVERY weight, anchor point and threshold in the tool lives in this file so the
# output is auditable. Changing a number here is changing the model's opinion —
# commit it, and say why in the rationale.
#
# Anchors are monotone piecewise-linear mappings: [[raw_value, stress], ...]
#   raw   = the observed value of the primitive, in `unit`
#   stress = 0 (calm / no bubble evidence) .. 100 (at a historical extreme)
# Values outside the outermost anchors extrapolate FLAT (clamped), never
# unbounded, so no single input can dominate the composite.
#
# Stress direction convention: for every indicator, HIGHER stress = MORE
# bubble-like. No indicator here is inverted — including the credit spreads,
# which is a deliberate decision documented in their rationale below.

# ---------------------------------------------------------------------------
# BASIS IN THE LITERATURE
#
# The rationales below are not the author's priors dressed as arithmetic. Each
# claim about *why* a measure matters for this particular episode traces to a
# published source, listed here so a reader can check the reasoning rather than
# take it on trust. Where this model departs from the literature it says so.
#
# [L1]  BIS Working Paper 1367, Rungcharoenkitkul (Jul 2026), "The AI investment
#       race". Models the boom as a contest in a winner-take-most market and
#       estimates over-investment at ~1.5x the efficient level, rising to ~3x
#       where demand is less elastic. Its two load-bearing claims for this model:
#       that debt and CIRCULAR STAKES create financial fragility, and that stress
#       in one firm can cascade through chains of financial exposures. Basis for
#       the `circularity` declared gap and for the leverage work.
#
# [L2]  BIS Bulletin 120, Aldasoro, Doerr & Rees (Jan 2026), "Financing the AI
#       boom: from cash flows to debt". The financing shift from operating cash
#       flow to debt, with private credit rising rapidly. Basis for the leverage
#       and (future) private-credit work.
#
# [L3]  IMF Global Financial Stability Report (Apr 2026), Ch.1. Contains Figure
#       1.18 "Artificial Intelligence Circularity" and Figure 1.17 on AI
#       value-stack balance-sheet vulnerabilities, and states that firms have
#       "increasingly relied on circular financing". Its assessment is that the
#       financial-stability impact is currently modest — a reading this tool does
#       not contradict and should not be read as contradicting.
#
# [L4]  Kshirsagar & Chen (Oct 2025), "The AI Infrastructure Revenue Gap". AI
#       accelerators have 1-3 year useful lives against 5-6 year depreciation
#       schedules; that gap is a quantified "capital subsidy" and turns a ~$800bn
#       revenue gap into >$1.5tn. Basis for the depreciation indicator, which is
#       deliberately NOT yet implemented — see its note below.
#
# [L5]  Van Nieuwerburgh (Mar 2026), "Financing the AI Buildout". Off-balance-sheet
#       structures, long-term leases and asset-backed lending let firms scale while
#       preserving balance-sheet flexibility, making the distribution of risk less
#       transparent. This is exactly the residual limitation the leverage indicator
#       states about itself.
#
# [L6]  Phillips, Shi & Yu (2015), "Testing for Multiple Bubbles", Int. Econ.
#       Review, and Sarkar & Wells (2026), "Is there an AI bubble?", Frontiers of
#       Mathematical Finance. The GSADF test implemented in src/gsadf.rs, and the
#       reason a hand-anchored composite is reported alongside a formal test
#       rather than instead of one.
#
# [L7]  Gürkaynak (2008), "Econometric Tests of Asset Price Bubbles: Taking
#       Stock", Fed FEDS 2005-04. The critical counterweight: conclusive real-time
#       bubble detection is close to impossible. This is the basis for the tool
#       refusing to emit any timing probability, and for every "not a forecast"
#       statement in the output.
#
# [L8]  Caballero (NBER w34722, 2026), "Speculative Growth and the AI 'Bubble'".
#       A third possibility beyond fundamentals-or-bubble: temporary overvaluation
#       can leave a PERMANENT real legacy. The strongest counter-argument to a
#       bubble reading, and the reason the report does not treat a high score as a
#       verdict. Basis for the falsification work still outstanding.
#
# [L9]  Wang & Chen (arXiv 2606.01575, 2026), "Boom, Bubble, or Buildout?". A
#       five-pillar framework (fundamental valuation, residual-exuberance tests,
#       SADF/GSADF, LPPL, sentiment/issuance, capex payback) concluding AI is "a
#       real technological revolution with localized bubble dynamics". The
#       multi-method principle behind reporting two methods that may disagree.
# ---------------------------------------------------------------------------

[meta]
# METHODOLOGY CHANGED 2026-09-20 — schema_version 2.0 -> 2.1.
#
# `circularity` moved from weight 0.0 (a declared gap) to weight 6.0 (a scored rubric over
# verified structures). Total weight 146 -> 152, so every archived run under 2.0 carries a
# composite computed on a different basis and is NOT comparable. The trend code refuses
# across this boundary automatically and says why, which is the intended behaviour.
#
# A note on the direction of this change, because it cuts against the model's own bias
# warning: the composite has drifted UP through this session largely by ADDING indicators
# that score high. Adding circularity at 6.0 raises it again. The defence is not that the
# new indicator is low, it is that it is EVIDENCE-CAPPED — it can only score structures that
# were read in a filing and classified, so it rises only when someone does the reading, and
# it has already come back lower once (the Oracle refutation).
schema_version = "2.1"
# Reviewed: 2026-09-16

[phase]
early_max = 35.0
mid_max = 55.0
late_max = 75.0

[coverage_floor]
low_below = 0.60
high_above = 0.85
# Weighted-coverage floor below which the composite is reported but flagged
# low-confidence. Set from the sum of the FRED-dependent weights, so a total
# FRED outage lands just under the "medium" boundary by construction.

# ---------------------------------------------------------------------------
# Direction of travel (v1.1).
#
# The trend is CONTEXT, not an eleventh indicator: none of this touches the
# composite. It is derived FROM the composite, so scoring it inside the composite
# would make the score partly a function of its own past.
#
# The single most important setting here is `coverage_tolerance_pp`. The
# composite is renormalized over available weight, so two runs with different
# coverage are NOT on the same scale — their difference is partly an artefact of
# which sources answered rather than a fact about the market. Rather than print a
# misleading number, the tool reports NO delta unless a baseline exists whose
# coverage is within this many percentage points of the current run.
# ---------------------------------------------------------------------------
[trend]
# Minimum elapsed time before a run may serve as the baseline, in days. Guards
# against a re-run minutes later being presented as a trend.
#
# MEASURED FROM RECORDED TIMESTAMPS, not from calendar dates. It was a calendar-date
# difference until this was fixed, and that defeated the guard at exactly the case it
# names: two runs either side of UTC midnight differed by "1 day" while being 17 minutes
# apart, and a direction of travel was reported from it. Only a run near midnight could
# trigger it, which is precisely where a scheduled job tends to land.
#
# 0.9 = 21.6 hours, chosen deliberately rather than left at 1.0:
#   * it still rejects any same-day re-run (a morning run and an evening run are ~12h
#     apart and are refused, which is the guard's whole purpose);
#   * it tolerates up to ~2.4 hours of timer jitter, so a genuine daily run that fires a
#     few minutes early is NOT discarded. A daily timer firing at 0.9977 days is normal,
#     and demanding a strict 24h would silently drop most legitimate comparisons.
# Raising this toward 1.0 makes the guard reject real daily observations over a few
# minutes of drift; lowering it toward 0.5 starts admitting intra-day noise as a trend.
min_gap_days = 0.9
# Maximum permitted difference in weighted coverage, in percentage points,
# between the current run and a candidate baseline run.
coverage_tolerance_pp = 5.0
# Absolute composite change below which the direction is reported as flat
# rather than up or down. Prevents noise being read as a signal.
flat_band = 1.0
# Number of most recent daily points drawn in the HTML sparkline.
sparkline_points = 30

# ---------------------------------------------------------------------------
# GSADF explosiveness test (methodology 1.3).
#
# A formal hypothesis test, NOT a scored indicator. It does not enter the
# composite: it is a different KIND of evidence, and averaging it in would destroy
# the value of having two independent methods.
#
# Reference: Phillips, Shi & Yu (2015), "Testing for Multiple Bubbles", Int. Econ.
# Review; applied to AI/semiconductors by Sarkar & Wells (2026), Frontiers of
# Mathematical Finance.
#
# The point is the DISAGREEMENT. "Composite: mid; explosiveness test: not
# significant" is more informative than either number alone. The report shows both
# and never reconciles them, because reconciling them would hide the tension a
# reader should see.
#
# `monte_carlo_reps` controls simulated critical values. They are generated here
# rather than taken from the published table, which is a real weakness stated in
# the output: the simulation assumes a pure random walk with no drift and no fat
# tails, whereas real equity returns have both.
# ---------------------------------------------------------------------------
[gsadf]
enabled = true
monte_carlo_reps = 200
# Fixed seed so the critical values cannot move between runs. A threshold that
# drifted run to run would make the whole report non-reproducible.
seed = 20260917

# ---------------------------------------------------------------------------
# Historical-analog bands.
#
# IMPORTANT: state extremity is NOT timing. These bands map the composite score
# to the gap between a comparable state and the eventual peak, observed in the
# named analogs. They are a coarse descriptive comparison over n=2 episodes, and
# the report marks them `is_probability = false`. Do not tune these to produce a
# more satisfying answer.
# ---------------------------------------------------------------------------
[analog]
method = "historical_analog"
analogs = ["dot-com 1999-2001 (S&P 500 / Nasdaq tech)", "telecom buildout 2000-2002 (debt-financed capacity)"]
derivation = "For each analog, the composite's component primitives (price stretch, concentration, VIX, credit spreads, cohort capex/cash-flow) were placed on a common timeline, and the interval between reaching a given band and the subsequent market peak was recorded. The band ranges below are the observed min/max spans across the two episodes, rounded outward. n=2: treat as an illustration of what such states have looked like, not a distribution."
caveat = "State extremity is not timing. A high composite means the present configuration resembles late-stage historical episodes; it says nothing certain about if or when a reversal occurs. Bubbles can persist for years, and this model has no basis for a point forecast."

[[analog_band]]
label = "early"
min = 0.0
max = 35.0
range_months = [30.0, 72.0]
note = "Comparable states historically persisted well over two years before a peak. Little timing information."

[[analog_band]]
label = "mid"
min = 35.0
max = 55.0
range_months = [15.0, 42.0]
note = "Two to three years of runway is typical of the observed analogs."

[[analog_band]]
label = "late"
min = 55.0
max = 75.0
range_months = [6.0, 24.0]
note = "Historically the final stretch, but with wide dispersion — the single most unreliable band."

[[analog_band]]
label = "critical"
min = 75.0
max = 100.0
range_months = [3.0, 18.0]
note = "Extremes in both analogs were reached only shortly before the peak, but n=2 makes the floor fragile."

# ---------------------------------------------------------------------------
# NOTE ON THE CREDIT INDICATORS: level vs direction.
#
# A plausible alternative reading is that TIGHT spreads are themselves the
# bubble signal (complacency, and credit did tighten into the dot-com peak).
# That reading is deliberately NOT implemented, for a concrete reason: HY OAS
# has a ~3.0% median over the available record and has rarely been wide, so a
# complacency-scored level would read most of the last decade as "bubble" — a
# near-constant that carries no timing information.
#
# Measured effect of the alternative on the whole composite: 32.4 -> 44.2, i.e.
# EARLY -> LATE. That is a full-phase swing resting on a definitional choice
# rather than on data, so the level reading is kept and the direction-of-travel
# signal (widening from a tight base) is the one to watch. If you want the other
# reading, mirror the two anchor stress values — the arithmetic is symmetric.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Indicators
# ---------------------------------------------------------------------------

[[indicator]]
id = "valuation_stretch"
label = "Equity valuation stretch"
weight = 14.0
unit = "pct deviation of S&P 500 from its 5-year log-linear trend"
source = "yahoo"
rationale = "The theoretically correct measure is equity risk premium compression (earnings yield minus the 10Y). No free earnings series is available, so this uses deviation of price from its own 5-year log-linear trend as a documented single-dimension proxy. The 10Y yield is reported alongside as context but is NOT scored here. PROXY strength: medium — trend deviation is real arithmetic, but it measures price, not earnings. NOTE on window sensitivity: 2/3/5/7/10-year windows give notably different deviations (roughly +1.5%/+31%/+22%/+20%/+19% measured across the same history), so this indicator is sensitive to the choice of lookback. 5 years is used as the central, least-extreme choice; shortening it materially raises the reported stress, which is a weakness of the measure rather than a fact about the market."
anchors = [[-15.0, 5.0], [-5.0, 12.0], [0.0, 18.0], [10.0, 32.0], [20.0, 50.0], [35.0, 70.0], [60.0, 90.0], [100.0, 98.0]]

[[indicator]]
id = "concentration"
label = "Index concentration (cap vs equal weight)"
# WEIGHT REDUCED 12.0 -> 6.0 at methodology 1.2. See the note below the anchors.
weight = 6.0
unit = "percentage-point spread, SPY 12m return minus RSP 12m return"
source = "yahoo"
# ---------------------------------------------------------------------------
# MEASURED DOUBLE-COUNTING WITH `breadth`. Do not treat these as two
# independent confirmations.
#
# Both indicators are algebraically the same quantity — equal-weight
# underperformance relative to cap-weight — measured over two windows. Measured
# correlation between them (10 years of monthly SPY/RSP data):
#
#     12-month window:  r = -0.70
#      6-month window:  r = -0.93   -> ~86% shared variance
#
# Reproduced independently by the maintainer on a separate 1-year daily sample:
# r = -0.54 to -0.59. The sign is negative by construction (a rising RSP/SPY ratio
# IS a shrinking cap-vs-equal gap), and the magnitude is the finding.
#
# The consequence for the model was that a single underlying phenomenon was
# carried at 12 + 10 = 22 combined weight, i.e. ~20% of the composite, while
# presenting itself as two separate pieces of evidence. That overstates the NUMBER
# OF INDEPENDENT CONFIRMATIONS, which is the thing a composite is supposed to
# aggregate honestly.
#
# Remedy chosen: retain BOTH (they are not redundant in level — one is a returns
# differential and one is a ratio-versus-trend measure, and each carries its own
# failure modes) but reduce the combined weight from 22 to 11, so the pair now
# carries the weight of roughly one strong indicator rather than two. This is a
# judgement about how much independent information the pair adds, not a claim that
# either is wrong.
#
# A reader must NOT read "concentration and breadth both elevated" as two
# corroborating signals. The report states the shared variance explicitly.
# ---------------------------------------------------------------------------
rationale = "Mega-cap dominance is the headline concentration concern. Computable proxy: when returns are carried by a handful of large names, cap-weight beats equal-weight. PROXY: weak-to-medium — it responds to any large-cap-vs-small-cap regime, not specifically to AI-related concentration, and it is a returns measure rather than the (unavailable) free-float market-cap share. IMPORTANT: this indicator is highly correlated with `breadth` — they measure the same equal-weight-versus-cap-weight quantity over different windows (measured r = -0.70 at 12m, -0.93 at 6m, i.e. up to ~86% shared variance). Their combined weight was reduced from 22 to 11 at methodology 1.2 to stop the model counting one phenomenon as two independent confirmations. Do not read agreement between the two as corroboration."
anchors = [[-8.0, 8.0], [-3.0, 15.0], [0.0, 22.0], [5.0, 35.0], [10.0, 50.0], [20.0, 70.0], [35.0, 88.0], [50.0, 95.0]]

[[indicator]]
id = "breadth"
label = "Market breadth"
# WEIGHT REDUCED 10.0 -> 5.0 at methodology 1.2. See the note under `concentration`.
weight = 5.0
unit = "pct, equal-weight/cap-weight ratio vs its 200-day average"
source = "yahoo"
rationale = "A narrowing rally lifts the index while most constituents lag; the RSP/SPY ratio falling through its own 200-day average is the classic breadth tell. PROXY: medium — this is a relative-performance breadth proxy, not advance/decline line or % of stocks above their 200d, which we cannot get free. Negatives are meaningful: if breadth is healthy, this indicator reports LOW stress and the composite says so. IMPORTANT: this is highly correlated with `concentration` — both measure equal-weight versus cap-weight performance, this one as a ratio-versus-trend and that one as a 12-month return differential (measured r = -0.70 at 12m, -0.93 at 6m). Their combined weight was reduced from 22 to 11 at methodology 1.2 so the model does not count one phenomenon twice, and the report now discloses the shared variance."
anchors = [[-20.0, 93.0], [-10.0, 78.0], [-5.0, 58.0], [-2.0, 40.0], [0.0, 28.0], [3.0, 15.0], [6.0, 8.0]]

[[indicator]]
id = "issuance"
label = "Net equity issuance / supply pressure"
weight = 10.0
unit = "pct, net equity issuance (cash raised minus cash paid to repurchase stock) divided by TTM operating cash flow"
source = "edgar"
# METHODOLOGY CHANGED 2026-09-17 — schema_version 1.0 -> 1.1.
#
# This indicator used to score the year-over-year change in shares outstanding.
# That nets buybacks against issuance, so it cannot tell "issuing hard" from
# "buying back hard" — opposite behaviours with the same sign. It is now computed
# from reported cash flows: proceeds from stock issuance MINUS cash paid to
# repurchase stock, over operating cash flow.
#
# The old proxy assumed the cash-flow tags were unavailable. Verified from this
# host 2026-09-17: us-gaap:PaymentsForRepurchaseOfCommonStock returns HTTP 200 for
# all five scored cohort members, and us-gaap:ProceedsFromIssuanceOfCommonStock
# returns 200 for MSFT, GOOGL, META and ORCL. Only AMZN genuinely reports no
# equity-issuance concept (it does not issue equity), which is handled as a named
# per-filer gap and never as a zero.
#
# Measured TTM values at the time of the change (net issuance / operating cash
# flow): ORCL +42.6%, AMZN 0.0% (buyback only, no issuance concept), MSFT
# -12.4%, GOOGL -33.8%, META -41.5%. Oracle is the only cohort member raising
# external equity, and the other four are retiring stock — a distinction the
# share-count proxy could not express.
#
# The anchors below are therefore calibrated on a cash-flow ratio, which has a
# far wider natural range than a share-count growth rate. Buybacks of this
# magnitude are a modern phenomenon, so the historical reference points that
# justify the extremes are weaker here than for the market indicators; the
# mid-range mapping is anchored on the cohort actually behaving this way.
# DIRECTION: positive (issuing) is high stress; negative (net retiring) is low.
rationale = "Late-stage bubbles are characterised by a wave of supply: IPOs, secondaries and share issuance, which history places near market peaks. Computed from REPORTED CASH FLOWS (proceeds from stock issuance minus cash paid to repurchase stock, over operating cash flow, trailing twelve months) rather than from share counts. This is real data, not a proxy: the cash-flow tags are available for every scored filer except AMZN, which reports no equity-issuance concept at all because it does not issue equity — a named gap, never a zero. A negative value means the cohort is retiring stock on net, which is the healthy direction and scores as low stress. REMAINING LIMITATION: a five-name mega-cap cohort still cannot see the broad IPO wave that historically marks a peak, since that is primary-market activity happening outside this cohort. This measures the cohort's own supply behaviour, not the market's. See also 'primary_market_supply', which measures the cohort-external IPO wave."
anchors = [[-60.0, 5.0], [-40.0, 10.0], [-20.0, 18.0], [-5.0, 28.0], [0.0, 38.0], [10.0, 55.0], [25.0, 72.0], [50.0, 88.0], [100.0, 96.0]]

[[indicator]]
id = "volatility"
label = "Volatility regime"
weight = 8.0
unit = "VIX index level"
source = "yahoo"
rationale = "Capital Economics found volatility consistent with a MID-stage bubble rather than a peak — muted volatility can mean complacency, but sustained high volatility usually means the peak has already passed. The anchors are therefore deliberately SHALLOW at the low end: a calm market is only mildly bubble-like, not strongly so. Also reported: 20-day realised volatility of the S&P 500 as a cross-check."
anchors = [[10.0, 5.0], [14.0, 15.0], [18.0, 30.0], [22.0, 45.0], [28.0, 62.0], [38.0, 80.0], [55.0, 93.0], [80.0, 98.0]]

[[indicator]]
id = "credit_hy"
label = "US high-yield credit spreads"
weight = 12.0
unit = "pct, ICE BofA US High Yield option-adjusted spread"
source = "fred"
fred_series = "BAMLH0A0HYM2"
rationale = "The single most important non-equity signal. Credit reprices faster and with covenants, and the debt-funded buildout means any disappointment transmits through credit first. DIRECTION: wide spread = high stress, tight spread = low stress. This is NOT inverted, and the choice is deliberate — see the 'credit level vs direction' note below. Scoring tight spreads as complacent/alarming would read almost the entire post-2009 record as a bubble: HY OAS has had a ~3.0% median and has rarely been wide, so a level-based complacency score would be near-constant and carry no timing information. What matters is the DIRECTION OF TRAVEL from a tight base — widening is the early warning, not the level. Read this indicator as the cost of credit, and watch its change."
anchors = [[2.0, 5.0], [2.8, 18.0], [3.5, 30.0], [5.0, 50.0], [7.0, 75.0], [10.0, 95.0]]

[[indicator]]
id = "credit_ig"
label = "US investment-grade credit spreads"
weight = 6.0
unit = "pct, Moody's Baa corporate bond yield less the 10-year Treasury yield"
source = "fred"
fred_series = "BAA10Y"
# ---------------------------------------------------------------------------
# SERIES CHANGED 2026-09-17 — schema_version 1.4 -> 1.5.
#
# Was: ICE BofA US Corporate option-adjusted spread (BAMLC0A0CM).
# Now: Moody's Baa yield less the 10-year Treasury (BAA10Y).
#
# The OAS is the better measure of investment-grade conditions in isolation, and it
# is given up reluctantly. The reason is history: EVERY ICE BofA series on FRED
# begins 2023-09-18 (verified 2026-09-17 for BAMLH0A0HYM2, BAMLC0A0CM, BAMLH0A1HYBB
# and others), and no free pre-2023 option-adjusted spread exists. With 2.5 years of
# data the anchors could not reference any observed stress episode — the series had
# never seen 2000, 2008 or 2020, so the top of its scale was an extrapolation.
# BAA10Y carries 10,177 observations from 1986-01-02 and includes all three.
#
# ANCHORS ARE SET ON THIS SERIES' OWN DISTRIBUTION, not transposed from the OAS.
# The two live on completely different scales — BAA10Y's median is 2.13 while the
# OAS currently sits at 0.78 — so carrying the old anchors across would have read
# the MIDDLE of forty years as near-alarm.
#
# Measured distribution, 1986-2026 (10,177 observations):
#   min 1.16 · 5th 1.50 · 10th 1.56 · 25th 1.74 · median 2.13 · 75th 2.66
#   90th 3.11 · 95th 3.32 · 99th 5.35 · max 6.06
# Observed episodes: 2000-03 (dot-com peak) 1.96 · 2002-10 (post-bust) 3.90 ·
# 2007-02 (pre-GFC tight) 1.56 · 2008-12 (GFC peak) 6.10 · 2020-03 (COVID) 4.31 ·
# latest 2026-09-16 1.43.
#
# NOTE: the falsification test for credit conditions also reads BAA10Y, so this
# indicator and that test are NOT independent — the same series read two ways. That
# is disclosed in the indicator's output rather than left for a reader to notice.
# ---------------------------------------------------------------------------
rationale = "Investment-grade credit conditions: the yield on Baa-rated corporate debt less the 10-year Treasury, a credit-risk premium for the lower half of investment grade. SERIES CHANGED 2026-09-17 from the ICE BofA US Corporate option-adjusted spread. The OAS is the better measure in isolation and was given up reluctantly: every ICE BofA series on FRED begins 2023-09-18, so with 2.5 years of data the anchors could not reference any observed stress episode — the series had never seen 2000, 2008 or 2020. BAA10Y runs from 1986 with 10,177 observations and includes all three, so the scale is now justified by history rather than extrapolation. Anchors are set on BAA10Y's OWN distribution (median 2.13, 95th 3.32, max 6.06) and deliberately NOT transposed from the OAS, which lives on a different scale entirely (OAS currently 0.78) — carrying them across would have read the middle of forty years as near-alarm. DIRECTION: wide = high stress, tight = low stress, unchanged; see the credit level-vs-direction note for why the complacency reading is deliberately not used. LIMITATION: the falsification test for credit conditions reads the same BAA10Y series, so the two are not independent measurements."
anchors = [[1.2, 4.0], [1.6, 14.0], [2.0, 26.0], [2.5, 42.0], [3.1, 60.0], [4.0, 80.0], [5.5, 94.0]]

[[indicator]]
id = "capex_vs_cashflow"
label = "Hyperscaler capex vs operating cash flow"
weight = 14.0
unit = "ratio, TTM capex divided by TTM operating cash flow, five-hyperscaler cohort"
source = "edgar"
rationale = "The core fundamental of this cycle: capital spending has grown past what the businesses generate internally, forcing the migration to debt markets. A ratio below ~0.5 is a self-funding business; above 1.0 the buildout is being financed externally, which is exactly the regime that converts a disappointing quarter into a refinancing story. Heaviest weight because it is the least subjective input: both numbers are audited figures from SEC filings, not market prices."
anchors = [[0.25, 5.0], [0.45, 18.0], [0.65, 35.0], [0.85, 52.0], [1.0, 68.0], [1.2, 85.0], [1.5, 96.0]]

[[indicator]]
id = "funding_gap"
label = "Infrastructure spend vs revenue"
weight = 8.0
unit = "ratio, TTM capex divided by TTM revenue, five-hyperscaler cohort"
source = "edgar"
rationale = "How much of the business is being plowed into AI infrastructure relative to what it sells. Rising capex/revenue is the signature of a capex boom outrunning monetisation. Caveat: hyperscaler revenue is mostly non-AI cloud and advertising, so this overstates the true AI capex-to-AI-revenue gap — the ~USD 600bn-wide gap often quoted comes from narrower segment data we cannot get from XBRL. Read as direction, not as that figure."
anchors = [[0.08, 8.0], [0.12, 25.0], [0.16, 42.0], [0.20, 58.0], [0.28, 78.0], [0.40, 94.0]]

[[indicator]]
id = "leverage"
label = "Cohort leverage (debt + leases vs cash generation)"
weight = 6.0
unit = "ratio, (total long-term debt + operating leases) divided by TTM operating cash flow"
source = "edgar"
# METHODOLOGY CHANGED 2026-09-17 — schema_version 1.1 -> 1.2.
#
# Two corrections, both measured from this host:
#
# 1. ORCL WAS REPORTED AS HAVING NO DEBT. us-gaap:LongTermDebt resolves for Oracle
#    to a single stale fact ending 2022-05-31 with value 0.0, and the previous
#    first-tag-that-answers resolver used it. Oracle's notes payable are ~$122bn
#    (us-gaap:LongTermNotesPayable) and it is the most exposed cohort member on
#    every other measure, so the bug reported the most leveraged company as the
#    least. Tag order now includes LongTermNotesPayable, and a stale-or-zero
#    series is REJECTED rather than used.
#
# 2. OPERATING LEASES WERE EXCLUDED, which the previous rationale admitted
#    understated true leverage. Measured effect of including them: cohort mean
#    goes 0.556x -> 0.955x operating cash flow, i.e. stress 18.2 -> 33.3, an
#    understatement of 15.1 points at this weight.
#
# Measured values at the change (debt+leases over TTM operating cash flow):
# MSFT 0.32x, GOOGL 0.87x, AMZN 1.61x, META 1.22x, ORCL 0.76x (debt-only for
# ORCL read 0.00x before the fix).
#
# Purchase obligations are deliberately NOT folded into this ratio: they are
# disclosed inconsistently (MSFT reports no such concept at all), and blending a
# partial total into the headline would make the ratio mean different things for
# different filers. They are reported alongside instead, and an absent disclosure
# renders as "not disclosed", NEVER as zero.
#
# The anchors below are shifted up from the old debt-only calibration, which is
# required for the measure to mean the same thing after the definition changed.
# They remain deliberately shallow at the low end: Capital Economics rates cohort
# leverage as not yet alarming relative to valuations, and that reading should
# still produce a moderate rather than a high score.
rationale = "Whether the cohort can carry the commitments it has signed. The financing shift this measures — from internal cash flow toward debt, with private credit rising fast — is the subject of BIS Bulletin 120 [L2], and the off-balance-sheet structures it still cannot see are the subject of Van Nieuwerburgh [L5]. Computed from reported total long-term debt PLUS operating lease liabilities, divided by TTM operating cash flow. Two corrections over the previous version, both measured 2026-09-17: (a) us-gaap:LongTermDebt resolves for ORCL to a stale 2022-05-31 fact worth exactly zero, so the old resolver reported the most leveraged company in the cohort as carrying no debt — ORCL's notes are ~$122bn under us-gaap:LongTermNotesPayable; (b) operating leases were excluded, which the old rationale admitted understated leverage. Including leases moves the cohort mean from 0.556x to 0.955x operating cash flow, an understatement of 15.1 stress points. A stale or exactly-zero series is now REJECTED rather than used, because both indicate a wrong tag rather than a fact. STILL EXCLUDES off-balance-sheet vehicles (SPVs, joint ventures, sale-leasebacks) that finance a growing share of data-centre construction, so true leverage remains higher than this ratio. Unconditional purchase obligations are reported alongside rather than folded in, because they are not universally disclosed and blending a partial total would make the ratio mean different things for different filers."
anchors = [[0.3, 5.0], [0.6, 14.0], [1.0, 28.0], [1.5, 48.0], [2.2, 70.0], [3.2, 88.0], [4.5, 96.0]]

[[indicator]]
id = "primary_market_supply"
label = "Primary-market supply (SEC registration statements)"
weight = 9.0
unit = "count of form S-1 registration statements filed in the trailing twelve months"
source = "edgar-fulltext"
rationale = "How much new equity supply is being pushed at the market, the broad IPO wave that the cohort-based 'issuance' indicator explicitly cannot see. Counted from SEC EDGAR full-text search over the trailing twelve months. It measures ATTEMPTS to sell stock, not money raised and not market absorption: many registrations are withdrawn or price far below the indicated range, and this cannot see offer price or first-day performance. Reference values measured from this host 2026-09-17 (annual S-1 counts): 2019 1,867; 2020 2,890; 2021 5,619 (the peak, and the clearest primary-market mania in the window); 2022 2,715; 2023 2,553; 2024 2,663; 2025 2,824. Anchors are deliberately shallow in the middle because this is a noisy count and a few hundred filings either way is not a regime change. A reading near the recent average says the primary market looks ordinary, which is NOT the same as no bubble: this is a supply measure and it carries no price information."
anchors = [[800.0, 4.0], [1500.0, 12.0], [2000.0, 22.0], [2600.0, 34.0], [3200.0, 48.0], [4000.0, 68.0], [5000.0, 85.0], [6200.0, 97.0]]

# ---------------------------------------------------------------------------
# Backlog quality (NEW, methodology 1.3).
#
# This indicator exists because of a measured finding, and it is deliberately NOT
# an RPO/revenue level measure. See the rationale for why.
#
# Measured from this host 2026-09-17, from SEC XBRL:
#
#   ORCL   RPO 137.8B (2025-05-31) -> 455.3B (2025-08-31): +230% in ONE quarter,
#          while deferred revenue went 10.7B -> 13.4B. RPO/deferred 12.8x -> 49.4x.
#   GOOGL  RPO/deferred 51.4x and still climbing.
#   MSFT   RPO/deferred 9.0x - 11.8x, the conservative position.
#
# Deferred revenue is cash actually billed for work not yet recognised. RPO is a
# promise. A backlog exploding while billed cash stays flat is the signature of
# non-cash consideration or vendor-financed commitments, and cannot be seen any
# other way in the free data.
#
# Anchors are set on the RATIO of RPO to deferred revenue, not on RPO itself:
#   below ~5x   the backlog is being billed roughly in proportion
#   ~10x        MSFT's position: large backlog, still converting
#   ~20-30x     conversion is materially lagging
#   >40x        the backlog is largely not converting (ORCL, GOOGL)
# ---------------------------------------------------------------------------
[[indicator]]
id = "backlog_quality"
label = "Backlog vs billed cash (RPO / deferred revenue)"
weight = 7.0
unit = "ratio, remaining performance obligation divided by contract liability (deferred revenue)"
source = "edgar"
rationale = "Whether contracted future revenue is converting into cash actually billed. The circular-financing pattern this is designed to detect — firms acting simultaneously as investor, supplier and customer — is documented by the BIS [L1] and the IMF [L3], and quantified by Polderdijk (Twente, 2026), who builds a Circular Financing Intensity index from customer concentration, vendor-linked financing and multi-year capacity commitments and finds it positively associated with valuation multiples. Deferred revenue is money collected for work not yet recognised; RPO is a promise. When RPO grows while deferred revenue stays flat, commitments are not converting, which is the signature of non-cash consideration or vendor-financed deals. Measured 2026-09-17: ORCL RPO went 137.8B to 455.3B in ONE quarter (+230%) while deferred revenue went 10.7B to 13.4B, taking its ratio from 12.8x to 49.4x; GOOGL sits at 51.4x and rising; MSFT is 9.0x-11.8x. DELIBERATELY NOT an RPO/REVENUE level measure: that ratio rises for every long-contract business and cannot distinguish a healthy multi-year backlog from a vendor granting deep discounts and financing its customers' purchases — measured ORCL 9.83x and MSFT 2.19x, and neither number is self-evidently bad. The divergence from billed cash is the informative part. KNOWN LIMITS: none of these contracts are tagged with counterparty credit quality, cancellation economics or termination-for-convenience clauses, so $664B of RPO and $664B of cash are not the same asset and this cannot tell the difference. META reports no RPO concept at all (the tag 404s), which is a gap and never a decline. A definition change made INSIDE a continuous tag is invisible to XBRL — GOOGL's Q1-2026 change was pure filing text — so companion text-diff logic is required and is NOT yet implemented. Treat this as a divergence screen, not a bubble verdict."
anchors = [[2.0, 6.0], [5.0, 15.0], [10.0, 28.0], [18.0, 45.0], [28.0, 62.0], [40.0, 80.0], [55.0, 92.0]]

# ---------------------------------------------------------------------------
# Private-credit lending growth (NEW, methodology 1.4).
#
# Closes the gap BIS Bulletin 120 [L2] identifies: the tool's two credit
# indicators read PUBLIC bond index spreads, while a rapidly increasing share of
# this cycle's debt is originated in private credit, which has no index spread
# because it does not trade.
#
# Measured from this host 2026-09-17, from the Fed's own Z.1 F4.4 table:
#
#   all sectors' private-credit loans:  $1.1tn (2024:Q1) -> $1.5tn (2026:Q2)
#   i.e. roughly +36% in ten quarters, while the public HY index spread barely moved.
#
# SOURCE NOTE: FRED does NOT mirror these series. The `FL893167205.Q` identifiers
# return "series does not exist" on FRED's keyed API, and FRED's own "private
# credit" search returns only BIS *total credit* aggregates, which are a different
# concept (all credit) and must not be substituted. The Fed publishes Z.1 only as
# an 8MB zip of 307 CSVs with no per-table endpoint, so the archive is read
# directly. The `zip` dependency reuses the same miniz_oxide decompressor already
# in the graph via ureq->flate2, so no new codec enters the build.
#
# SCORED ON GROWTH, NOT LEVEL: the outstanding stock of economy-wide private credit
# is not a bubble signal, whereas rapid expansion is what the BIS claim asserts.
#
# THE LIMITATION IS SEVERE AND IS REPEATED IN THE INDICATOR'S OWN OUTPUT: Z.1
# reports a whole-economy total. It is NOT AI-specific. This measures the CHANNEL,
# not the AI share of it, and a high reading is consistent with the BIS thesis
# without confirming it.
# ---------------------------------------------------------------------------
[[indicator]]
id = "private_credit_growth"
label = "Private-credit lending growth (whole-economy channel)"
weight = 6.0
unit = "pct, year-over-year growth in private-credit loans outstanding"
source = "fed-z1"
rationale = "How fast the private-credit channel is expanding, which the two public spread indicators cannot see because private credit does not trade and so has no index spread. BIS Bulletin 120 identifies private credit as taking a rapidly increasing role in financing the AI buildout. Measured 2026-09-17 from the Fed's Z.1 F4.4 table: all-sector private-credit loans went from roughly $1.1tn (2024:Q1) to $1.5tn (2026:Q2), about +36% in ten quarters, while the public high-yield index spread barely moved. CRITICAL LIMITATION: Z.1 reports private credit as a TOTAL FOR THE WHOLE ECONOMY, not for AI. Nothing in the free data attributes an individual private loan to a data-centre or GPU borrower, so this measures the size and growth of the financing CHANNEL and not the amount reaching AI. Growth here is consistent with the BIS thesis and does not establish it. Scored on GROWTH rather than level, because the outstanding stock is not itself a bubble signal whereas rapid expansion is what the BIS claim actually asserts."
anchors = [[-10.0, 5.0], [0.0, 15.0], [8.0, 32.0], [16.0, 50.0], [25.0, 68.0], [35.0, 84.0], [50.0, 95.0]]

# ---------------------------------------------------------------------------
# Data-center construction (NEW, methodology 1.6).
#
# THE ONLY PHYSICAL SERIES IN THE MODEL. Every other indicator is a price, a credit
# spread, or financial statements — all financial CLAIMS about the buildout, and all
# capable of moving on sentiment. This is dollars actually spent on buildings, from
# the US Census Bureau's Construction Spending survey, so it cannot be talked up.
#
# Measured from this host 2026-09-17, full-year totals ($M):
#   2015   2,745      2022  12,583
#   2019   8,483      2023  19,995
#   2021   9,949      2024  34,797  (+74.0% YoY)
#                     2025  49,737  (+42.9% YoY)
#   latest month Jul-2026 = 6,551, +58.5% year over year
#
# SOURCE: census.gov/construction/c30/xlsx/privtime.xlsx — an xlsx, because there is
# no CSV and no keyless API (the EITS endpoint returns "Missing Key" and FRED carries
# the aggregate construction series but NOT the data-center line item). Read with
# the same zip support already present for the Fed Z.1 work.
#
# SCORED ON YEAR-OVER-YEAR GROWTH, NOT LEVEL. A large and stable construction market
# is not a bubble signal; accelerating spend beyond what demand can absorb is. The
# anchors therefore treat moderate growth as ordinary and only extreme acceleration
# as high stress.
#
# DOUBLE-EDGED, AND THE OUTPUT SAYS SO. Rapid construction growth is evidence the
# boom is real and large — which is exactly what makes a bust costly. A high reading
# here is consistent with BOTH the bubble thesis and a durable buildout, and this
# tool does not claim to resolve that.
# ---------------------------------------------------------------------------
[[indicator]]
id = "datacenter_construction"
label = "Data-center construction spending (physical)"
weight = 7.0
unit = "pct, year-over-year growth in US data-center construction spending"
source = "census-c30"
rationale = "The only PHYSICAL series in this model: dollars actually spent building data centres, from the US Census Bureau's Construction Spending survey, rather than a price or a credit spread that could move on sentiment alone. Measured 2026-09-17, full-year totals: 2015 $2,745M; 2019 $8,483M; 2021 $9,949M; 2022 $12,583M; 2023 $19,995M; 2024 $34,797M (+74.0%); 2025 $49,737M (+42.9%); latest month Jul-2026 $6,551M, up 58.5% year over year. Scored on year-over-year GROWTH rather than level, because a large and stable construction market is not a bubble signal whereas accelerating spend beyond what demand can absorb is. DELIBERATELY DOUBLE-EDGED, and the output says so: rapid construction growth is evidence the boom is real and large, which is precisely what makes an eventual bust costly, so a high reading is consistent with both the bubble thesis and a durable buildout. LIMITATIONS: measures buildings and not the IT hardware inside them; nominal dollars, not deflated, so input-cost inflation inflates the line without new capacity; Census added the line item only in the May 2024 release with estimates from January 2014, so no data-center series covers 2000 or 2008 and the scale describes this boom rather than a full cycle."
anchors = [[-15.0, 5.0], [0.0, 12.0], [10.0, 21.0], [25.0, 34.0], [40.0, 50.0], [60.0, 68.0], [85.0, 84.0], [120.0, 95.0]]

# ---------------------------------------------------------------------------
# Grid cancellations (NEW, methodology 1.7).
#
# The binding physical constraint on the AI buildout is firm electricity, and the
# practical bottleneck is the interconnection queue. This measures announced
# generating capacity that was then ABANDONED — intent that did not survive contact
# with reality, which turns before the spending does.
#
# Measured from this host 2026-09-17, EIA-860M July 2026 release:
#   Planned               291,138 MW
#   Canceled or Postponed 184,141 MW   ->  cancellation ratio 38.7%
#   cancelled by technology: gas combined cycle 59,466 MW; gas combustion turbine
#   31,064 MW; solar 28,517 MW; onshore wind 15,752 MW; coal 15,409 MW
#
# INTERPRETATION LIMIT, carried in the output as well as here: the EIA sheets are
# cumulative INVENTORIES, not flows. A high ratio means many announced projects have
# been abandoned across the whole accumulation window, NOT that cancellations are
# spiking now. This is a LEVEL of abandoned intent. Catching the RATE would require
# comparing successive monthly releases against each other, which is not
# implemented and must not be implied.
#
# SOURCE: eia.gov/electricity/data/eia860m/ — xlsx only, and the keyless API is
# inaccessible (api.eia.gov/v2 returns a "Missing Key" page and no EIA key is
# configured). Read with the same xlsx reader built for Census C30. Sheets located
# by NAME, never by position, so a reordering cannot silently read the wrong sheet.
# ---------------------------------------------------------------------------
[[indicator]]
id = "grid_cancellations"
label = "Abandoned generating capacity (grid pipeline)"
weight = 6.0
unit = "pct, cancelled or postponed capacity as a share of announced plus cancelled capacity"
source = "eia-860m"
rationale = "How much announced power-plant capacity has been abandoned, measured against what is still planned. The grid is the binding physical constraint on the AI buildout and the interconnection queue is the practical bottleneck, so cancelled generation is intent that did not survive contact with reality and it turns before the spending does. Measured 2026-09-17 from the EIA-860M July 2026 release: 291,138 MW planned against 184,141 MW cancelled or postponed, a 38.7% ratio, with the largest abandoned categories being gas combined cycle (59,466 MW), gas combustion turbine (31,064 MW), solar (28,517 MW), onshore wind (15,752 MW) and coal (15,409 MW). INTERPRETATION LIMIT: the EIA sheets are cumulative INVENTORIES, not flows, so this is a LEVEL of abandoned intent accumulated over the window and NOT a rate of change — it does not show whether cancellations are rising now. Catching the direction of travel would require comparing successive monthly releases against each other, which is not implemented. A second limitation: the same accumulation applies to the planned side, so the denominator includes projects that will themselves be cancelled, which biases the ratio downward."
anchors = [[5.0, 8.0], [12.0, 18.0], [20.0, 30.0], [30.0, 45.0], [40.0, 60.0], [55.0, 78.0], [75.0, 93.0]]

# ---------------------------------------------------------------------------
# Narrative saturation (NEW, methodology 1.8).
#
# How many companies discuss AI in their regulatory filings, from a CENSUS of SEC
# full-text search. Measured from this host 2026-09-17:
#
#   10-K filings mentioning "artificial intelligence"
#     2015     41        2021    848        2025  3,324
#     2018    294        2023  1,295        (81x over the decade)
#   8-K, same measure: 45 (2015) -> 4,690 (2025), 104x
#
# WHY THIS CENSUS AND NOT A NEWS/SEARCH MEASURE. This project refuses to guess, and
# the usual hype proxies — news volume, social chatter, search interest — are SAMPLES
# with unclear provenance and unstable definitions. EDGAR full-text search counts
# EVERY filing of a form type in a period, so there is no sampling error and no
# panel-selection bias, and the phrase can be pinned exactly. Verified to reproduce
# to the filing: a second independent run returned identical counts for 2015, 2018,
# 2021, 2023 and 2025.
#
# WHAT IT IS NOT: a valuation or a risk measure. A filing mentioning AI may come from
# a chip designer or a bakery noting a supply-chain risk, and the count cannot tell
# enthusiasm from caution. It measures narrative SATURATION — how far a theme has
# spread into general disclosure — and is reported for that reason.
#
# SCORED ON YEAR-OVER-YEAR CHANGE, annualised. The count is bounded by the number of
# filers and must saturate eventually. Annualising matters: without it, every run
# before December would report a collapse in AI mentions as a calendar artefact.
# ---------------------------------------------------------------------------
[[indicator]]
id = "narrative_saturation"
label = "AI narrative saturation (SEC filing census)"
weight = 5.0
unit = "pct, annualised year-over-year change in 10-K filings mentioning artificial intelligence"
source = "edgar-fulltext"
rationale = "How many companies discuss AI in their regulatory filings, used as a measure of narrative saturation rather than of valuation. EDGAR full-text search is a CENSUS, not a sample: every filing of a form type in the period is indexed, so unlike news volume, social chatter or search interest there is no sampling error, no panel-selection bias, and the phrase is pinned exactly. Measured 2026-09-17: 10-K filings mentioning 'artificial intelligence' ran 41 (2015) → 294 (2018) → 848 (2021) → 1,295 (2023) → 3,324 (2025), an 81x increase over the decade, and the 8-K equivalent ran 45 → 4,690, a 104x increase; a second independent run reproduced every figure exactly. WHAT IT DOES NOT MEASURE: it is not a valuation or a risk measure. A mention may come from a chip designer or from a bakery noting a supply-chain risk, and the count cannot distinguish enthusiasm from caution — so a high reading is equally consistent with hype spreading and with ordinary disclosure practice maturing. Scored on ANNUALISED year-over-year change, because the count is bounded by the number of filers and must saturate; annualising prevents every run before December reporting a calendar artefact as a collapse in AI mentions."
anchors = [[-25.0, 6.0], [0.0, 14.0], [20.0, 26.0], [40.0, 42.0], [60.0, 58.0], [85.0, 75.0], [120.0, 92.0]]

[[indicator]]
id = "foreign_interest"
label = "Foreign ownership of US equities"
weight = 5.0
unit = "percentile of rest-of-world US corporate equity holdings within the series' own history"
source = "fed-z1"
# ---------------------------------------------------------------------------
# THE DECLARED GAP WAS WRONG, and it is retired here rather than quietly dropped.
#
# This indicator carried weight 0 with the rationale "There is no free,
# machine-readable series for it at the required timeliness, so it is carried with
# weight 0 as an explicitly acknowledged blind spot." That was false. The Fed's Z.1
# Financial Accounts publish rest-of-world holdings of US corporate equities
# quarterly, free, no key, with history back to 1945 — series FL263064105.Q in the
# M3s table, read through the same archive the private-credit indicator already
# uses.
#
# Verified from this host 2026-09-17: $22.21tn at 2026:Q2, up 25.7% year over year,
# against $8.13tn as recently as 2019:Q4.
#
# Declaring something unmeasurable when it is measurable is its own kind of
# dishonesty: it converts a gap in effort into a claim about the world, and a reader
# cannot tell the difference from the outside. So it is scored now, and the change
# is recorded here rather than made silently.
# ---------------------------------------------------------------------------
# SCORED ON THE PERCENTILE OF ITS OWN HISTORY, not the dollar level. The absolute
# stock grows with the market itself, so a raw level would rise in every bull market
# whether or not foreign participation increased. A percentile against 80 years of
# the same series is the only interpretable version of this number.
#
# DIRECTION: higher = more stress. Capital Economics flags record foreign ownership
# as a LATE-STAGE marker: a market increasingly held by investors whose willingness
# to hold depends on returns continuing is more fragile, not less.
#
# Anchors put a mid-history reading near the middle, and the top of the scale at
# readings only seen in the most extreme episodes. Kept deliberately conservative at
# the low end, because foreign participation rising from a low base is not itself
# evidence of anything.
rationale = "How much of the US equity market is held by foreign investors, expressed as a percentile of the series' own history. Capital Economics flags record foreign ownership of US equities as a late-stage marker, and the Fed's Z.1 Financial Accounts carry it directly: series FL263064105.Q, 'Rest of the world; U.S. corporate equities; asset', quarterly, free, no key, history from 1945. Measured 2026-09-17: $22.21tn at 2026:Q2, up 25.7% year over year, against $8.13tn at 2019:Q4. THIS INDICATOR WAS A DECLARED BLIND SPOT AT WEIGHT 0 UNTIL 2026-09-17, on the stated grounds that no free machine-readable series existed at the required timeliness — that claim was false, and the gap is retired rather than quietly dropped. Scored on the PERCENTILE of its own history, not the dollar level: the absolute stock grows with the market itself, so a raw level would rise in every bull market whether or not foreign participation actually increased. DIRECTION: a higher percentile reads as more stress, following Capital Economics' treatment of record foreign ownership as a late-stage marker — a market increasingly held by investors whose willingness to hold depends on returns continuing is more fragile. Limitation: Z.1 reports holdings including valuation changes, so a rising series partly reflects US equities outperforming rather than foreign investors buying more."
anchors = [[5.0, 6.0], [25.0, 14.0], [50.0, 26.0], [70.0, 42.0], [85.0, 60.0], [95.0, 80.0], [99.0, 92.0]]
# ---------------------------------------------------------------------------
# Depreciation "capital subsidy" (NEW, methodology 1.9).
#
# Kshirsagar & Chen [L4] observe that AI accelerators have 1-3 year useful lives
# against 5-6 year depreciation schedules, and that the gap is a quantified "capital
# subsidy" which turns a ~$800bn revenue gap into more than $1.5tn. Mechanically: if
# a company extends useful lives, annual depreciation falls relative to the asset
# base and reported earnings are flattered without any improvement in the business.
#
# THE GUARD IS THE WHOLE INDICATOR, and it took five attempts to get right. A naive
# "the rate fell" test flags SIX of nine companies — including AAPL and AVGO, which
# show the same drift with no AI capex at all, because a mechanical ratio drifts as
# older fully-depreciated assets age into the denominator — and it MISSED ORCL, the
# actual signal. Two stages are required:
#
#   1. the gross-PP&E series must pass `series_health` (continuity, recency, density,
#      definition stability). This rejects AMZN — an 1,827-day hole with a definition
#      swap to a finance-lease-inclusive tag, whose apparent -12.99 point rate fall is
#      a data artefact — plus META (abandoned the tag in 2020) and GOOGL (20 months
#      stale). Three of nine fail.
#   2. the rate test covers the trailing FOUR ANNUAL periods, deduplicated by date
#      (EDGAR repeats a fact once per filing), ANDed with asset growth: the rate must
#      fall more than half a point AND gross PP&E must more than 1.5x. The AND is what
#      suppresses AAPL (-1.24pt, PP&E 1.10x) and AVGO (-1.35pt, 1.27x).
#
# Measured 2026-09-17. With both stages, exactly ONE of nine flags:
#
#   ORCL  rate 6.41% -> 6.22% while gross PP&E grew 4.28x   <- the anomaly
#   MSFT  +1.23pt, PP&E 2.63x        AAPL  -1.24pt, 1.10x (suppressed)
#   NVDA  +1.16pt, 2.61x             AVGO  -1.35pt, 1.27x (suppressed)
#
# Anchors map the SIZE of the rate extension in percentage points. The scale is
# deliberately steep at the low end: a sub-half-point move does not clear the guard at
# all, so it scores zero, and only multi-point extensions read as high stress.
# ---------------------------------------------------------------------------
[[indicator]]
id = "depreciation_subsidy"
label = "Depreciation schedule extension (capital subsidy)"
weight = 6.0
unit = "percentage points the annual depreciation rate fell while the asset base grew"
source = "edgar"
rationale = "Tests the capital-subsidy claim from Kshirsagar & Chen: AI accelerators have 1-3 year useful lives while the schedules depreciate them over 5-6 years, so extending a useful life flatters reported earnings without any improvement in the business. Measured 2026-09-17 over the trailing four annual periods: ORCL's rate fell from 6.41% to 6.22% while gross PP&E grew 4.28x, the single flagged anomaly; MSFT and NVDA rates ROSE (+1.23pt, +1.16pt); AAPL (-1.24pt) and AVGO (-1.35pt) showed the same drift with no AI capex and are deliberately suppressed. THE GUARD IS THE WHOLE INDICATOR: a naive rate test flags six of nine companies and misses ORCL, because a mechanical ratio drifts as older fully-depreciated assets age into the denominator. Two stages are required — the gross-PP&E series must first pass a continuity/recency/density/definition-stability check (which rejects AMZN, a data artefact from a definition swap, plus META and GOOGL for staleness), and the rate test must then be ANDed with an asset-growth condition (which suppresses AAPL and AVGO). With both stages exactly one of nine flags. LIMITATIONS: this detects a CHANGE in a filer's depreciation convention rather than an initially aggressive one, so a company that always depreciated over six years never flags; and gross PP&E aggregates buildings and hardware, so the test cannot say which the useful life refers to."
anchors = [[0.0, 0.0], [0.5, 0.0], [1.0, 14.0], [2.0, 30.0], [3.5, 52.0], [5.0, 72.0], [8.0, 92.0]]

# ---------------------------------------------------------------------------
# Frontier premium (NEW, methodology 2.0).
#
# The one structural feature no previous bubble had: the financed asset is contested
# by an open ecosystem that publishes weights. Railways needed land, telecom needed
# spectrum, the dot-com buildout needed proprietary code. Here the core asset is
# reproducible by anyone, and the gap between best-closed and best-open is small.
#
# Measured 2026-09-19 from 243 LMArena leaderboard snapshots (2023-05 .. 2026-09):
#   2024-02-02   +135.0 Elo   <- peak
#   2024-09-17    +89.2
#   2025-01-24     -5.3       <- briefly NEGATIVE: best open model outranked best closed
#   2025-06-24    +54.0
#   2026-04-02    +25.0
#   2026-09-13    +32.5       <- latest (claude-fable-5.1-max vs glm-5.3-max)
#
# Compression from peak: ~76%. That is the moat closing, in measurable form.
#
# DIRECTION IS INVERTED relative to most indicators in this file: a NARROW gap scores
# as HIGH stress, because the capital spending assumes a wide moat. A wide gap means
# the premium is earned and scores low. Anchors are therefore DESCENDING in the gap.
#
# GENUINELY TWO-SIDED, and the output says so: a closing gap is bad for the incumbents
# financing the buildout and good for AI adoption generally. This tool does not pretend
# the number has one meaning.
#
# SOURCE: LMArena's leaderboard dataset on HuggingFace, published as parquet. Extracted
# once with pyarrow and the RESULT committed as a JSON fixture, so the test suite needs
# no parquet reader and no 56MB download.
# ---------------------------------------------------------------------------
[[indicator]]
id = "frontier_premium"
label = "Open-versus-closed capability premium (the moat)"
weight = 6.0
unit = "Elo points by which the best closed model leads the best open one (LOW = high stress)"
source = "lmarena"
rationale = "How much better the best closed model is than the best open-weight one, which is the moat that has to justify the capital spending. This is the structural feature no prior bubble had: in railways, telecom and the dot-com buildout the financed asset could not be reproduced by anyone else, whereas here an open ecosystem publishes weights and the gap is small and measurable. Measured 2026-09-19 from 243 LMArena snapshots: the premium ran +135 Elo at its 2024-02 peak, briefly went NEGATIVE in 2025-01 when the best open model outranked the best closed one outright, and sits at +32.5 — a compression of about 76%. DIRECTION IS INVERTED HERE: a NARROW gap scores as HIGH stress, because the spending assumes a wide moat; a wide gap means the premium is earned. GENUINELY TWO-SIDED: a closing gap is bad for the incumbents financing the buildout and good for AI adoption generally. LIMITATIONS: arena ratings measure human PREFERENCE on voted prompts rather than the enterprise workloads that generate revenue; a 'Proprietary' licence is not literally 'weights unreleased'; and the gap is between the single best model on each side, so one release moves it sharply."
# DESCENDING: small gap = high stress (the inversion, made explicit in the anchors)
anchors = [[0.0, 92.0], [15.0, 80.0], [30.0, 62.0], [50.0, 42.0], [80.0, 26.0], [110.0, 14.0], [140.0, 6.0]]

[[indicator]]
id = "circularity"
label = "Circular financing in the AI buildout (verified structures only)"
# WAS 0.0 AS A DECLARED GAP. Raised to 6.0 at methodology 2.1, on evidence.
#
# WHY THE GAP WAS CLOSED. The weight-0 entry said circularity was unmeasurable because "the
# measure required is a RELATIONSHIP between companies while every indicator here is a price
# or a single-company aggregate". That was too strong. A relationship IS disclosed, in
# related-party and equity-method accounting, and EDGAR full-text search filtered by `ciks=`
# attributes it to a filer. The structures below were read in the filings themselves.
#
# WHY THE WEIGHT IS SMALL (6.0). The evidence is a handful of read edges, not a series. The
# rubric is coarse by design, so a small weight limits how far a coarse judgment can move the
# composite. This is deliberately NOT sized to the importance of the topic — circular
# financing may well be the single most important feature of this bubble — it is sized to the
# STRENGTH OF THE EVIDENCE, which is what a weight is meant to express.
weight = 6.0
source = "sec-edgar (read filings)"
unit = "pct of the expressible rubric scale — verified structures as a share of the strongest possible reading"
rationale = "SCORED FROM A RUBRIC, NOT A RATIO, AND THAT IS STATED RATHER THAN HIDDEN. Every other indicator here is a number retrieved from a source: a spread, a percentage, a ratio. Circular financing is not available as a number, because no free source publishes 'share of counterparty revenue funded by the investor's own capital'. The honest options were to leave it at weight 0 as a gap, or to state the scoring rule explicitly, apply it only to edges whose filing text was actually READ, and let a reader disagree with the weights. This does the second. THE RUBRIC, and it is arguable: a supplier guaranteeing AND investing in its customer's infrastructure = 45; equity issued to a customer as consideration for its purchases = 40; a parent absorbing its AI unit's debt onto its own balance sheet = 30; disclosed related-party revenue alongside an equity stake = 25; a related-party supply deal under common control = 10; a mention that was read and REFUTED = 0. WHAT MAKES IT FALSIFIABLE RATHER THAN ASTROLOGY: every scored element is a specific structure in a specific filing, with a citation, a magnitude, and a written falsifier, so each edge can be shown wrong. One ALREADY WAS — Oracle's two OpenAI hits are a model-integration list, not a contract, and score ZERO. An unfalsifiable indicator could not produce that outcome; this one did on its first real test, and the refutation is retained in the set deliberately because it is the evidence that the rubric can come back LOWER. WHAT IS SCORED: only edges whose text was read. The scan finds roughly 48 real ecosystem edges and about five have been read, so the great majority contribute NOTHING, and an unread edge scores zero rather than partially. The reading is therefore a LOWER BOUND and its direction of bias is toward CALM — the opposite of alarm. Treat a low number as 'little has been verified yet', never as 'little is there'. WHAT IS DELIBERATELY NOT SCORED: hit counts. A raw count would let 'NVDA names NVIDIA 136 times' and 'CRWV names CoreWeave 145 times' — companies naming THEMSELVES — dominate the reading. The rubric consumes only classified structures. ALSO NOT SCORED: NPORT-P fund holdings, which give the investor side with real dollar values (Anthropic $56.5M, OpenAI $49.3M) but cannot distinguish a circular arrangement from an ordinary portfolio position. NOT USED AS A PROXY: us-gaap:EquitySecuritiesFvNiUnrealizedGainLoss, which is mark-to-market P&L on stakes held rather than the amount invested or the revenue flowing back. See [L1] and [L3]."
anchor_note = "SCORED ON THE FRACTION OF THE EXPRESSIBLE SCALE, NOT THE ABSOLUTE RUBRIC TOTAL. The total rises every time an edge is read, so scoring it directly would let READING EFFORT raise the reading and conflate 'more verified' with 'worse'. The fraction is stable under that pressure and moves the right way: a refutation adds to the ceiling and nothing to the total, so it LOWERS the score. The anchors below are therefore on 0-100 PERCENT, not on points. 0% = nothing verified; 100% = every verified edge is the strongest possible structure."
anchors = [[0.0, 5.0], [25.0, 25.0], [45.0, 45.0], [60.0, 60.0], [80.0, 80.0], [95.0, 95.0]]
